name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build backend
        run: npm run server:build

      - name: Run backend tests
        run: npm run server:test

      - name: Build backend Docker image
        run: docker build -f server/Dockerfile -t penguwave-backend:pr-${{ github.event.pull_request.number }} .

      - name: Build frontend Docker image
        run: docker build -f Dockerfile -t penguwave-frontend:pr-${{ github.event.pull_request.number }} .
